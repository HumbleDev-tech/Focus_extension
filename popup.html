<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Libertad Focus</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app-window">
    <!-- Unified Top Bar -->
    <header class="top-bar">
      <div class="brand-group">
        <img class="brand-icon" src="icons/icon48.png" alt="Libertad Logo" />
        <span class="brand-title">LIBERTAD</span>
        <div class="status-indicator" id="statusPill">
          <span class="status-dot"></span>
          <span class="status-label" id="statusText">ACTIVE</span>
        </div>
      </div>
      <div class="tool-controls">
        <div class="mini-segmented" id="themeGroup">
          <button type="button" class="mini-btn theme-btn" data-theme="dark" title="Dark Theme">DRK</button>
          <button type="button" class="mini-btn theme-btn" data-theme="light" title="Light Theme">LGT</button>
          <button type="button" class="mini-btn theme-btn" data-theme="oled" title="OLED Theme">OLED</button>
        </div>
        <div class="mini-segmented" id="langGroup">
          <button type="button" class="mini-btn lang-btn" data-lang="en" title="English">EN</button>
          <button type="button" class="mini-btn lang-btn" data-lang="es" title="Español">ES</button>
        </div>
      </div>
    </header>

    <!-- Preset Toolbar -->
    <section class="pane-section preset-section">
      <div class="pane-header">
        <span class="pane-title" data-i18n="focusPresetLabel">FOCUS PRESET</span>
      </div>
      <div class="ide-segmented-track" id="presetGroup">
        <button type="button" class="ide-tab preset-btn" data-preset="off" data-i18n="presetOff">OFF</button>
        <button type="button" class="ide-tab preset-btn" data-preset="basic" data-i18n="presetBasic">BASIC</button>
        <button type="button" class="ide-tab preset-btn" data-preset="balanced" data-i18n="presetBalanced">BALANCED</button>
        <button type="button" class="ide-tab preset-btn" data-preset="extreme" data-i18n="presetExtreme">EXTREME</button>
        <button type="button" class="ide-tab preset-btn" data-preset="custom" data-i18n="presetCustom">CUSTOM</button>
      </div>
      <div class="preset-status-line" id="presetDesc">
        Suppresses sidebar recommendations, comments, shorts feeds, and endscreens.
      </div>
    </section>

    <!-- Main Shield Parameters List -->
    <section class="pane-section">
      <div class="pane-header accordion-trigger" id="customAccordionBtn" role="button" tabindex="0" aria-expanded="true" aria-controls="togglesList">
        <span class="pane-title" data-i18n="parametersLabel">PARAMETERS // FINE-TUNE</span>
        <span class="accordion-arrow" id="accordionIcon">
          <svg viewBox="0 0 16 16" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6l5 5 5-5"/>
          </svg>
        </span>
      </div>
      <div class="settings-list" id="togglesList">
        <!-- Setting: Home Feed -->
        <label class="setting-row" for="toggleHomeFeed">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleHomeFeedTitle">Home Feed</span>
            <span class="setting-hint" data-i18n="toggleHomeFeedDesc">Suppress infinite recommendations grid</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleHomeFeed" aria-label="Suppress Home Feed" />
            <span class="slider"></span>
          </div>
        </label>

        <!-- Setting: Sidebar -->
        <label class="setting-row" for="toggleSidebar">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleSidebarTitle">Related Sidebar</span>
            <span class="setting-hint" data-i18n="toggleSidebarDesc">Suppress watch-next suggested videos</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleSidebar" aria-label="Suppress Related Sidebar" />
            <span class="slider"></span>
          </div>
        </label>

        <!-- Setting: Comments -->
        <label class="setting-row" for="toggleComments">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleCommentsTitle">Comments</span>
            <span class="setting-hint" data-i18n="toggleCommentsDesc">Suppress video comments section</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleComments" aria-label="Suppress Comments" />
            <span class="slider"></span>
          </div>
        </label>

        <!-- Setting: Shorts -->
        <label class="setting-row" for="toggleShorts">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleShortsTitle">Shorts</span>
            <span class="setting-hint" data-i18n="toggleShortsDesc">Suppress shorts tab, shelves, and navigation</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleShorts" aria-label="Suppress Shorts" />
            <span class="slider"></span>
          </div>
        </label>

        <!-- Setting: Endscreens -->
        <label class="setting-row" for="toggleEndScreens">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleEndScreensTitle">End Screens</span>
            <span class="setting-hint" data-i18n="toggleEndScreensDesc">Suppress popup cards at video conclusion</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleEndScreens" aria-label="Suppress End Screens" />
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </section>

    <!-- Auxiliary Modules List -->
    <section class="pane-section">
      <div class="pane-header">
        <span class="pane-title" data-i18n="auxiliaryLabel">AUXILIARY MODULES</span>
      </div>
      <div class="settings-list">
        <label class="setting-row" for="toggleDislikes">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleDislikesTitle">Restore Dislikes</span>
            <span class="setting-hint" data-i18n="toggleDislikesDesc">Display public dislike count on action bar</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleDislikes" aria-label="Restore Dislikes" />
            <span class="slider"></span>
          </div>
        </label>
        <label class="setting-row" for="toggleUntranslate">
          <div class="setting-meta">
            <span class="setting-title" data-i18n="toggleUntranslateTitle">Untranslate Titles</span>
            <span class="setting-hint" data-i18n="toggleUntranslateDesc">Preserve creator's original video title</span>
          </div>
          <div class="switch">
            <input type="checkbox" id="toggleUntranslate" aria-label="Untranslate Video Titles" />
            <span class="slider"></span>
          </div>
        </label>
      </div>
    </section>

    <!-- Clean Footer -->
    <footer class="app-footer">
      <div class="scale-box">
        <span class="scale-label" data-i18n="scaleLabel">SCALE</span>
        <div class="mini-segmented" id="scaleGroup">
          <button type="button" class="mini-btn scale-btn" data-scale="100" title="Standard (100%)">1x</button>
          <button type="button" class="mini-btn scale-btn" data-scale="115" title="Comfortable (115% - 27&quot;)">1.15x</button>
          <button type="button" class="mini-btn scale-btn" data-scale="125" title="Expanded (125% - 4K)">1.25x</button>
        </div>
      </div>
      <button type="button" class="reset-action" id="resetBtn" data-i18n="resetBtn">RESET CONFIG</button>
    </footer>
  </div>

  <script src="i18n.js"></script>
  <script src="popup.js"></script>
</body>
</html>
